[package]
name = "json_prettify"
version = "0.1.0"
edition = "2021"
authors = ["Nathan Sanchez natetheskate1130@gmail.com"]
description = "A simple CLI tool to prettify JSON"
license = "MIT"
readme = "README.md"

[dependencies]
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"